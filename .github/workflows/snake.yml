name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: Jhean-Monteiro
          outputs: |
            dist/snake.svg?palette=bg:%230d1117,%23331111,%23662222,%23993333,%23ff4444
            dist/snake-dark.svg?palette=bg:%230d1117,%23331111,%23662222,%23993333,%23ff4444
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
